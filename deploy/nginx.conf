# EDUZIYO — Nginx (Cloudflare Tunnel orqasida). Haqiqiy mijoz IP manzili CF-Connecting-IP'dan olinadi —
# faqat shaxsiy (Docker/LAN) manzillardan kelgan so'rovga ishoniladi; veb-port tashqi internetga ochilmaydi.
# Cloudflare orqali https kelganini Laravel'ga bildirish (map faqat server{} dan tashqarida bo'ladi)
map $http_x_forwarded_proto $edu_https { default off; https on; }

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 12m;
    server_tokens off;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;

    location = /up { access_log off; try_files $uri /index.php?$query_string; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # Yig'ilgan frontend va ikonkalar: uzoq keshlanadi (fayl nomida hash bor)
    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; try_files $uri =404; }
    location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ { expires 30d; access_log off; try_files $uri =404; }

    # Service worker keshlanmasin
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Sirli fayllar
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:env|log|sql|zip|key|pem|bak|sqlite)$ { deny all; }

    # Faqat index.php ishlaydi (yuklangan fayllar orqali kod bajarilmasin)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $edu_https;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    location ~ \.php$ { return 404; }
}
